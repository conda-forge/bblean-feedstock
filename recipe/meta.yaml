{% set version = "0.12.0" %}

package:
  name: bblean
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bblean/bblean-{{ version }}.tar.gz
  sha256: 2df53376332c96ed4a5c8fd76e759236c5fbfa18fd1f3874380b129628f03dd7

build:
  entry_points:
    - bb = bblean.cli:app
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - BITBIRCH_BUILD_CPP=1  # [unix]
    - BITBIRCH_BUILD_CPP=0  # [win]
  number: 0
  skip: true  # [py<311]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('c') }}    # [unix]
    - {{ compiler('cxx') }}  # [unix]
    - {{ stdlib("c") }}      # [unix]
  host:
    - python
    - setuptools >=75.6
    - setuptools-scm >=9
    - pybind11
    - wheel
    - tomli
    - pip
  run:
    - python
    - scipy
    - rdkit
    - numpy >=2
    - pandas
    - psutil
    - matplotlib-base
    - colorcet
    - seaborn
    - scikit-learn
    - rich
    - typer
    - typing_extensions
    - opentsne
    - umap-learn
    - pynndescent

test:
  imports:
    - bblean
  commands:
    - pip check
    - bb --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/bblean/
  summary: BitBirch-Lean Python package
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timpalpant
